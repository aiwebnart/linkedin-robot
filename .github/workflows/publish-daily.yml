name: Publish daily LinkedIn antimetrica

on:
  schedule:
    # Both UTC hours cover 10:00 Europe/Paris across daylight-saving changes.
    - cron: '0 8,9 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only; never call LinkedIn'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  group: linkedin-antimetricas-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run tests
        run: npm run check
      - name: Publish or preview
        env:
          LINKEDIN_AUTOMATION_APPROVED: ${{ secrets.LINKEDIN_AUTOMATION_APPROVED }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_TOKEN_EXPIRES_AT: ${{ secrets.LINKEDIN_TOKEN_EXPIRES_AT }}
          LINKEDIN_API_VERSION: ${{ secrets.LINKEDIN_API_VERSION }}
        run: node src/run-daily.js ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Save publication state
        if: always()
        run: |
          git config user.name "linkedin-robot[bot]"
          git config user.email "linkedin-robot[bot]@users.noreply.github.com"
          git add state/publication-log.json
          git diff --cached --quiet || git commit -m "chore: record LinkedIn publication"
          git push