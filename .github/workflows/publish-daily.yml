name: Prepare daily LinkedIn publication

on:
  schedule:
    - cron: '0 8,9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linkedin-antimetricas-preparation
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run tests
        working-directory: linkedin-robot
        run: npm run check
      - name: Prepare manual publication
        working-directory: linkedin-robot
        run: node src/run-daily.js
      - name: Save preview
        run: |
          git config user.name "linkedin-companion[bot]"
          git config user.email "linkedin-companion[bot]@users.noreply.github.com"
          git add linkedin-robot/state/today-preview.md
          git diff --cached --quiet || git commit -m "chore: prepare daily LinkedIn publication"
          git push